<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Saga: Realm of Knowledge</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-gold: #f59e0b;
      --text: #f8fafc;
      --correct: #22c55e;
      --wrong: #ef4444;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .game-container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 2px solid #334155;
    }

    /* Header & Stats Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #334155;
      margin-bottom: 20px;
    }

    .character-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      background: var(--accent-gold);
      color: #000;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.8rem;
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: #334155;
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #0f172a;
    }

    /* Question Cards */
    .card {
      background: #0f172a;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #334155;
      margin-bottom: 15px;
    }

    .origin-tag {
      display: inline-block;
      background: #3b82f6;
      color: white;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 15px;
    }

    .option-btn {
      background: #1e293b;
      border: 1px solid #475569;
      color: white;
      padding: 12px;
      border-radius: 6px;
      text-align: left;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .option-btn:hover {
      border-color: var(--accent);
    }

    /* Feedback & Solution */
    .analysis-box {
      margin-top: 15px;
      padding: 15px;
      border-radius: 6px;
      display: none;
    }

    .analysis-box.correct {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid var(--correct);
    }

    .analysis-box.wrong {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--wrong);
    }

    .action-btn {
      background: var(--accent-gold);
      color: black;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .hidden { display: none; }
  </style>
</head>
<body>

<div class="game-container">
  <!-- Status Header -->
  <div class="status-bar">
    <div class="character-info">
      <span style="font-size: 1.8rem;">🧙‍♂️</span>
      <div>
        <strong>Scholar Lvl <span id="player-level">1</span></strong>
        <div style="font-size: 0.8rem; color: #94a3b8;">XP: <span id="player-xp">0</span> / 100</div>
      </div>
    </div>
    <div>
      <span class="badge" id="subject-badge">Class 11 & 12 Syllabus</span>
    </div>
  </div>

  <!-- Navigation -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchMode('objective')">Objective Realm (PYQs/MCQs)</button>
    <button class="tab-btn" onclick="switchMode('subjective')">Subjective Sanctum (Boards)</button>
  </div>

  <!-- Objective Section -->
  <div id="objective-section">
    <div class="card">
      <span class="origin-tag" id="obj-tag">NEET 2022 | Class 11 Biology</span>
      <h3 id="obj-question">Loading Question...</h3>
      <div class="options-grid" id="obj-options"></div>
      
      <div id="obj-analysis" class="analysis-box">
        <h4 id="analysis-title" style="margin-top: 0;"></h4>
        <p id="analysis-text"></p>
        <button class="action-btn" onclick="nextObjectiveQuestion()">Next Challenge ➔</button>
      </div>
    </div>
  </div>

  <!-- Subjective Section -->
  <div id="subjective-section" class="hidden">
    <div class="card">
      <span class="origin-tag" id="subj-tag">CBSE Class 12 Chemistry | 3 Marks</span>
      <h3 id="subj-question">Loading Question...</h3>
      
      <button class="action-btn" onclick="toggleSubjectiveAnswer()">Reveal Solution & Marking Scheme</button>
      
      <div id="subj-analysis" class="analysis-box" style="margin-top: 15px; background: #1e293b; border: 1px solid var(--accent);">
        <h4 style="color: var(--accent); margin-top: 0;">Official Marking Scheme (NCERT):</h4>
        <p id="subj-answer"></p>
        <button class="action-btn" onclick="rewardSubjectiveXP()">I Mastered This (+20 XP)</button>
        <button class="action-btn" style="background: #475569; color: white;" onclick="nextSubjectiveQuestion()">Skip / Next</button>
      </div>
    </div>
  </div>

</div>

<script>
  // --- Game State ---
  let xp = 0;
  let level = 1;

  // --- Sample Question Database (Expandable) ---
  const objectiveQuestions = [
    {
      question: "Which of the following hormones is not secreted by the human placenta?",
      options: ["hCG", "Estrogens", "Progesterone", "LH"],
      correct: 3,
      tag: "NEET 2021 | Class 12 Biology",
      conceptMissed: "LH (Luteinizing Hormone) is secreted by the Anterior Pituitary, not the placenta. Human Placenta secretes hCG, hPL, estrogens, and progesterone."
    },
    {
      question: "Dimensions of stress are equal to that of:",
      options: ["Force", "Pressure", "Work", "Energy"],
      correct: 1,
      tag: "JEE Main 2020 | Class 11 Physics",
      conceptMissed: "Stress = Force / Area. Pressure = Force / Area. Thus, both share the same dimensional formula [M L⁻¹ T⁻²]."
    }
  ];

  const subjectiveQuestions = [
    {
      question: "State Raoult's Law for a solution containing non-volatile solute. Write its mathematical expression.",
      tag: "CBSE Boards 2023 | Class 12 Chemistry",
      answer: "• <strong>Definition (1.5 Marks):</strong> For a solution of non-volatile solutes, the relative lowering of vapor pressure is equal to the mole fraction of the solute.<br>• <strong>Mathematical Expression (1.5 Marks):</strong> (P° - P) / P° = x₂ (where x₂ is the mole fraction of solute)."
    }
  ];

  let currentObjIdx = 0;
  let currentSubjIdx = 0;

  // --- Gamification Logic ---
  function addXP(points) {
    xp += points;
    if (xp >= 100) {
      level += 1;
      xp -= 100;
      alert(`🎉 LEVEL UP! You are now Level ${level}! Keep conquering board & competitive questions!`);
    }
    document.getElementById('player-xp').innerText = xp;
    document.getElementById('player-level').innerText = level;
  }

  // --- Render Objective Questions ---
  function loadObjective() {
    const q = objectiveQuestions[currentObjIdx];
    document.getElementById('obj-tag').innerText = q.tag;
    document.getElementById('obj-question').innerText = q.question;
    
    const optionsContainer = document.getElementById('obj-options');
    optionsContainer.innerHTML = '';
    document.getElementById('obj-analysis').style.display = 'none';

    q.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = `${String.fromCharCode(65 + idx)}. ${opt}`;
      btn.onclick = () => checkObjective(idx);
      optionsContainer.appendChild(btn);
    });
  }

  function checkObjective(selectedIdx) {
    const q = objectiveQuestions[currentObjIdx];
    const analysisBox = document.getElementById('obj-analysis');
    const title = document.getElementById('analysis-title');
    const text = document.getElementById('analysis-text');

    // Disable option buttons after picking
    document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);

    if (selectedIdx === q.correct) {
      analysisBox.className = 'analysis-box correct';
      title.innerText = "🎯 Critical Hit! Correct Answer!";
      title.style.color = "var(--correct)";
      text.innerHTML = `<strong>Source Insight:</strong> ${q.conceptMissed}`;
      addXP(25);
    } else {
      analysisBox.className = 'analysis-box wrong';
      title.innerText = "⚠️ Quest Failed! What You Missed:";
      title.style.color = "var(--wrong)";
      text.innerHTML = `<strong>Correct Answer:</strong> Option ${String.fromCharCode(65 + q.correct)}<br><br><strong>Key Learning:</strong> ${q.conceptMissed}`;
    }
    analysisBox.style.display = 'block';
  }

  function nextObjectiveQuestion() {
    currentObjIdx = (currentObjIdx + 1) % objectiveQuestions.length;
    loadObjective();
  }

  // --- Render Subjective Questions ---
  function loadSubjective() {
    const q = subjectiveQuestions[currentSubjIdx];
    document.getElementById('subj-tag').innerText = q.tag;
    document.getElementById('subj-question').innerText = q.question;
    document.getElementById('subj-answer').innerHTML = q.answer;
    document.getElementById('subj-analysis').style.display = 'none';
  }

  function toggleSubjectiveAnswer() {
    const analysisBox = document.getElementById('subj-analysis');
    analysisBox.style.display = analysisBox.style.display === 'none' ? 'block' : 'none';
  }

  function rewardSubjectiveXP() {
    addXP(20);
    nextSubjectiveQuestion();
  }

  function nextSubjectiveQuestion() {
    currentSubjIdx = (currentSubjIdx + 1) % subjectiveQuestions.length;
    loadSubjective();
  }

  // --- UI Navigation ---
  function switchMode(mode) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    if (mode === 'objective') {
      event.target.classList.add('active');
      document.getElementById('objective-section').classList.remove('hidden');
      document.getElementById('subjective-section').classList.add('hidden');
    } else {
      event.target.classList.add('active');
      document.getElementById('subjective-section').classList.remove('hidden');
      document.getElementById('objective-section').classList.add('hidden');
    }
  }

  // --- Initialization ---
  loadObjective();
  loadSubjective();
</script>

</body>
    </html>
